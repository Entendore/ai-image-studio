[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-studio"
version = "1.3.0"
description = "Desktop AI image generator & photo editor (Stable Diffusion / OpenAI-compatible APIs)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6", "Pillow>=10.0", "requests>=2.31", "psutil>=5.9"]

[project.optional-dependencies]
local = ["torch>=2.1", "diffusers>=0.27", "transformers>=4.40",
         "accelerate>=0.30", "safetensors>=0.4", "huggingface_hub>=0.23", "tqdm"]
bg-removal = ["rembg>=2.0"]
keyring = ["keyring>=24"]
dev = ["pytest>=8"]

[project.gui-scripts]
ai-image-studio = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
